name: Bright satellites
on:
  schedule:
    - cron: "23 */4 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: bright-sats
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/bright_sats.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets/bright-sats.json
          git diff --cached --quiet && exit 0
          git commit -m "Update bright satellite elements"
          git pull --rebase origin main
          git push
