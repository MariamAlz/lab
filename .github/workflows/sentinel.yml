name: Sentinel-2 scene
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pystac-client rasterio pillow numpy
      - run: python .github/scripts/sentinel.py
      - name: Commit the scene
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets/s2
          git diff --cached --quiet || git commit -m "Update the Sentinel-2 scene of Abu Dhabi"
          git push
